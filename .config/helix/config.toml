theme = "dark-synthwave"

[editor]
mouse = false

[editor.statusline]
left = ["mode", "separator", "spinner"]

[keys.normal]
space.B = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
space.v = ":vsplit"
space.h = ":hsplit"
space.q = "wclose"
space.w.h = "jump_view_left"
space.w.j = "jump_view_down"
space.w.k = "jump_view_up"
space.w.l = "jump_view_right"

